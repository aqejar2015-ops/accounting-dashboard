<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Page Guide</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <h1>AI Page Guide</h1>

      <label for="apiKey">OpenAI API Key</label>
      <textarea id="apiKey" rows="3" placeholder="أدخل مفتاح OpenAI هنا..."></textarea>

      <label for="question">السؤال</label>
      <textarea id="question" rows="4" placeholder="مثل: كيف أضيف عميل جديد؟ أو ما معنى هذا الزر؟"></textarea>

      <div class="buttons">
        <button id="analyzeBtn">تحليل الصفحة</button>
        <button id="clearBtn" class="secondary">مسح المفتاح</button>
      </div>

      <div id="status" class="status">جاهز</div>

      <div id="result" class="result">
        ستظهر التعليمات هنا بعد تحليل الصفحة.
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
